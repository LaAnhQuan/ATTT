<section class="dashboard-page">
    <mat-card class="dashboard-card">
        <div class="header">
            <div>
                <h1>Danh sach nhan vien</h1>
                <p *ngIf="!loading && !errorMessage">Tong so nhan vien: <strong>{{ total }}</strong></p>
            </div>

        </div>

        <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

        <div *ngIf="errorMessage" class="state-message error">{{ errorMessage }}</div>

        <div class="table-wrap" *ngIf="!errorMessage">
            <table mat-table [dataSource]="users" class="user-table">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let user">{{ user.id }}</td>
                </ng-container>

                <ng-container matColumnDef="username">
                    <th mat-header-cell *matHeaderCellDef>Username</th>
                    <td mat-cell *matCellDef="let user">{{ user.username }}</td>
                </ng-container>

                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
                </ng-container>

                <ng-container matColumnDef="phone">
                    <th mat-header-cell *matHeaderCellDef>Phone</th>
                    <td mat-cell *matCellDef="let user">{{ user.phone }}</td>
                </ng-container>

                <ng-container matColumnDef="password">
                    <th mat-header-cell *matHeaderCellDef>Password</th>
                    <td mat-cell *matCellDef="let user">{{ user.password || '**********' }}</td>
                </ng-container>

                <ng-container matColumnDef="role">
                    <th mat-header-cell *matHeaderCellDef>Role</th>
                    <td mat-cell *matCellDef="let user">
                        <span class="role-badge" [class.role-admin]="user.role === 'admin'">{{ user.role }}</span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                <tr class="mat-row" *ngIf="!loading && users.length === 0">
                    <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">Khong co du lieu nhan vien.</td>
                </tr>
            </table>
        </div>
    </mat-card>
</section>
